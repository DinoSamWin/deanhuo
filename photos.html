<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/favicon.ico?v=20260912-4">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/dean-logo-32.png?v=20260912-4">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/dean-logo-16.png?v=20260912-4">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/dean-logo-180.png?v=20260912-4">
    <title>Photos | Dean Huo</title>
    <meta name="description" content="Dean Huo 的摄影作品集。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dean Huo">
    <meta property="og:title" content="Photos | Dean Huo">
    <meta property="og:description" content="浏览 Dean Huo 的摄影作品与光影记录。">
    <meta property="og:image" content="https://www.deanhuo.com/assets/images/brand/dean-logo-512.png">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preload" href="assets/fonts/cormorant-garamond-light.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/photo-exhibition.css?v=12">
    <script defer src="js/wechat-share.js?v=20260912-song-summary-2"></script>
    <script src="assets/vendor/lucide-1.45.0.min.js"></script>
</head>

<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-btn" data-tooltip="Home" aria-label="首页"><i data-lucide="house" style="width: 20px;"></i></a>
        <a href="photos.html" class="nav-btn active" data-tooltip="Photos"><i data-lucide="camera"
                style="width: 20px;"></i></a>
        <a href="lyrics.html" class="nav-btn" data-tooltip="Lyrics"><i data-lucide="file-text"
                style="width: 20px;"></i></a>
        <a href="music.html" class="nav-btn" data-tooltip="Music"><i data-lucide="music" style="width: 20px;"></i></a>
        <a href="projects.html" class="nav-btn" data-tooltip="Projects"><i data-lucide="briefcase"
                style="width: 20px;"></i></a>
        <a href="knowledge.html" class="nav-btn" data-tooltip="Knowledge Base"><i data-lucide="book"
                style="width: 20px;"></i></a>
    </nav>

    <main class="container photos-main">
        <div style="text-align: center; margin-bottom: 60px;">
            <h1 class="font-heading" style="font-size: 48px;">Photography</h1>
            <p class="text-secondary">Capturing moments in time.</p>
            <button class="photo-exhibition-entry" id="open-photo-exhibition" type="button" aria-haspopup="dialog" disabled>
                <i data-lucide="orbit" aria-hidden="true"></i><span>3D展览</span><span aria-hidden="true">↗</span>
            </button>
        </div>

        <div class="masonry-grid">
            <!-- Photos will be loaded dynamically here -->
        </div>
    </main>
    <dialog class="photo-exhibition" id="photo-exhibition" aria-labelledby="photo-exhibition-title">
        <div class="photo-exhibition-world">
            <div class="photo-exhibition-backdrop" aria-hidden="true"></div>
            <div class="photo-exhibition-stage" aria-label="摄影作品展墙，拖动或使用左右方向键浏览"></div>
            <div class="photo-exhibition-foreground" aria-hidden="true"></div>
        </div>
        <header class="photo-exhibition-heading">
            <p>DEAN HUO · PHOTOGRAPHY</p>
            <h2 id="photo-exhibition-title">Every Frame<br>Has a Story.</h2>
            <span>光影之间，片刻永恒</span>
        </header>
        <button class="photo-exhibition-close" type="button" aria-label="关闭3D展览">✕</button>
        <button class="photo-exhibition-sound" type="button" aria-pressed="false" aria-controls="photo-exhibition-audio">♫ 开启音乐</button>
        <button class="photo-exhibition-arrow photo-exhibition-prev" type="button" aria-label="上一张照片">←</button>
        <button class="photo-exhibition-arrow photo-exhibition-next" type="button" aria-label="下一张照片">→</button>
        <footer class="photo-exhibition-footer">
            <span class="photo-exhibition-counter" aria-live="polite" aria-atomic="true"></span>
            <span>左右拖动巡展 · 点击照片走近观看</span>
            <div class="photo-exhibition-progress" aria-hidden="true"><span></span></div>
            <button class="photo-exhibition-autoplay" type="button" aria-pressed="true">暂停巡展</button>
            <button class="photo-exhibition-inspect" type="button">查看这张照片 ↗</button>
            <p class="photo-exhibition-music-credit"><a href="https://music.bugs.co.kr/track/2286346" target="_blank" rel="noopener noreferrer">Versailles（凡尔赛）· Haneda Ryoko</a><br>展厅混响版</p>
        </footer>
        <audio id="photo-exhibition-audio" src="assets/audio/photo-gallery-versailles-hall.mp3" preload="none" loop></audio>
    </dialog>
    <dialog id="photo-detail-viewer" class="photo-detail-viewer" aria-labelledby="photo-detail-title" aria-describedby="photo-detail-help">
        <div class="photo-detail-veil" aria-hidden="true"></div>
        <header class="photo-detail-header"><span>DEAN HUO · UP CLOSE</span><button class="photo-detail-close" type="button" aria-label="返回展墙">✕ 返回展墙</button></header>
        <div class="photo-detail-viewport"><div class="photo-detail-flight"><div class="photo-detail-art"><img alt="" draggable="false"></div></div></div>
        <footer class="photo-detail-footer">
            <h3 class="photo-detail-title" id="photo-detail-title"></h3><p class="photo-detail-english"></p>
            <p class="photo-detail-description"></p>
            <div class="photo-detail-tools"><button type="button" data-zoom="out" aria-label="缩小照片">−</button><span class="photo-detail-zoom-level">100%</span><button type="button" data-zoom="in" aria-label="放大照片">＋</button><button type="button" data-zoom="reset">适应屏幕</button></div>
            <p class="photo-detail-status" id="photo-detail-help" role="status"></p>
        </footer>
    </dialog>
    <dialog id="photo-gallery-intro" class="photo-gallery-intro" aria-labelledby="photo-intro-title">
        <button class="photo-intro-close" type="button" aria-label="取消进入展览">✕</button>
        <div class="photo-intro-content">
            <span class="photo-intro-eyebrow">DEAN HUO · PHOTOGRAPHY</span>
            <div class="photo-intro-orbit" aria-hidden="true"><span></span></div>
            <h2 id="photo-intro-title">走入光影之间</h2><p class="photo-intro-english">A moment before the exhibition</p>
            <p class="photo-intro-status" role="status"></p>
            <div class="photo-intro-progress" aria-hidden="true"><span></span></div>
            <button class="photo-intro-play" type="button" hidden>播放开场音频</button>
            <button class="photo-intro-skip" type="button">跳过，进入展馆 ↗</button>
        </div>
        <audio id="photo-gallery-intro-audio" src="assets/audio/photo-gallery-entrance-slow95.mp3" preload="none"></audio>
    </dialog>
    <script src="js/image-utils.js?v=china-performance-1"></script>
    <script src="js/recommendations.js?v=trash-progress"></script>
    <script src="js/photo-exhibition-audio.js?v=14"></script>
    <script src="js/photo-exhibition-intro.js?v=13"></script>
    <script src="js/photo-exhibition-viewer.js?v=9"></script>
    <script src="js/photo-exhibition.js?v=13"></script>
    <script src="js/photos.js?v=photo-exhibition-1"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
